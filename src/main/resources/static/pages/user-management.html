<section class="panel user-management-panel admin-only-action" hidden>
    <div class="panel-header">
        <div>
            <h2>사용자 관리</h2>
            <p>ADMIN 권한으로 VIEWER 사용자의 비밀번호 초기화와 계정 잠금 해제를 수행합니다.</p>
        </div>
    </div>

    <div class="user-management-grid">
        <article class="user-management-card">
            <div class="user-management-card-icon" aria-hidden="true">PW</div>
            <div class="user-management-card-content">
                <h3>사용자 비밀번호 초기화</h3>
                <p>사용자 아이디를 지정하고 새 비밀번호를 설정합니다. 비밀번호 원문은 감사 기록에 저장하지 않습니다.</p>
            </div>
            <button id="adminPasswordResetOpenButton" type="button" class="user-management-action-button">
                비밀번호 초기화
            </button>
        </article>

        <article class="user-management-card">
            <div class="user-management-card-icon" aria-hidden="true">UL</div>
            <div class="user-management-card-content">
                <h3>사용자 계정 잠금 해제</h3>
                <p>로그인 실패 누적으로 잠긴 사용자 계정을 ADMIN 권한으로 해제합니다.</p>
            </div>
            <button id="adminAccountUnlockOpenButton" type="button" class="user-management-action-button">
                계정 잠금 해제
            </button>
        </article>
    </div>

    <div class="user-management-guide">
        사용자 관리 기능은 화면 표시 여부와 별개로 서버의 <strong>ADMIN 권한 검사</strong>를 통과해야 실행됩니다.
    </div>
</section>
