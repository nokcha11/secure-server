<section class="panel account-page-panel">
    <div class="panel-header">
        <div>
            <h2>내 계정</h2>
            <p>현재 로그인한 계정 정보와 본인 비밀번호 변경 기능을 확인합니다.</p>
        </div>
    </div>

    <div class="account-page-grid">
        <article class="account-page-card">
            <span class="account-page-label">사용자 아이디</span>
            <strong id="accountPageUsername">-</strong>
        </article>

        <article class="account-page-card">
            <span class="account-page-label">권한</span>
            <strong id="accountPageRole">-</strong>
        </article>

        <article class="account-page-card">
            <span class="account-page-label">로그인 상태</span>
            <strong id="accountPageLoginStatus">계정 확인 중</strong>
        </article>
    </div>

    <div class="account-page-action-card">
        <div>
            <h3>비밀번호 변경</h3>
            <p>현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다. 변경 후에는 다시 로그인해야 합니다.</p>
        </div>

        <button id="accountPagePasswordChangeButton" type="button" class="account-page-primary-button">
            비밀번호 변경
        </button>
    </div>
</section>
