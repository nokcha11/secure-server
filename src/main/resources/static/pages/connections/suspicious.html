<section class="network-section suspicious-section">

    <div class="section-header">
        <div>
            <h2>의심스러운 네트워크 연결</h2>
            <p>보안 규칙에 따라 주의가 필요한 연결을 표시합니다.</p>
        </div>

        <div class="suspicious-count-area">
            <span>탐지된 의심 연결</span>
            <strong id="suspiciousConnectionCount">0건</strong>
        </div>
    </div>

    <div id="suspiciousStatusMessage" class="security-status-message">의심 연결 정보를 불러오는 중입니다.</div>

    <div class="network-selection-guide">
        <span>의심 연결에서도 항목을 선택해 다른 연결과 함께 분석할 수 있습니다.</span>
    </div>

    <div class="table-wrapper suspicious-table-wrapper">
        <table class="network-table network-compact-table suspicious-table">
            <thead>
                <tr>
                    <th class="network-select-column">
                        <input id="suspiciousSelectAllCheckbox" class="network-master-checkbox" type="checkbox" aria-label="의심 연결 전체 선택">
                    </th>
                    <th>활성 여부</th>
                    <th>프로토콜</th>
                    <th>상대방 IP</th>
                    <th>상대방 포트</th>
                    <th>상태</th>
                    <th>프로세스</th>
                    <th>외부 IP</th>
                    <th class="network-detail-column">상세</th>
                </tr>
            </thead>

            <tbody id="suspiciousConnectionTableBody">
                <tr>
                    <td colspan="9" class="empty-message">의심 연결 정보를 불러오는 중입니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
