<section class="network-section history-section">

    <div class="section-header">
        <div>
            <h2>종료된 연결 이력</h2>
            <p>이전에 연결되었다가 현재 종료된 네트워크 연결입니다. 종료 시각과 판정 이유는 상세 영역에서 확인합니다.</p>
        </div>

        <div class="network-controls">
            <input type="search" id="historySearchInput" placeholder="상대방 IP, 포트, 프로세스 검색">

            <select id="historyFilter">
                <option value="ALL">전체 종료 이력</option>
                <option value="EXTERNAL">외부 연결</option>
                <option value="SUSPICIOUS">의심 연결</option>
            </select>
        </div>
    </div>

    <div class="network-selection-guide">
        <span>현재 연결에서 선택한 항목과 함께 선택하여 통합 분석할 수 있습니다.</span>
    </div>

    <div class="table-wrapper network-compact-wrapper">
        <table class="network-table network-compact-table">
            <thead>
                <tr>
                    <th class="network-select-column">
                        <input id="historySelectAllCheckbox" class="network-master-checkbox" type="checkbox" aria-label="종료 이력 전체 선택">
                    </th>
                    <th>프로토콜</th>
                    <th>상대방 IP</th>
                    <th>상대방 포트</th>
                    <th>상태</th>
                    <th>프로세스</th>
                    <th>외부 IP</th>
                    <th>의심 여부</th>
                    <th class="network-detail-column">상세</th>
                </tr>
            </thead>

            <tbody id="connectionHistoryTableBody">
                <tr>
                    <td colspan="9" class="empty-message">종료된 연결 이력을 불러오는 중입니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
