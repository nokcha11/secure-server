<section class="audit-workspace">

    <div class="audit-page-header">
        <div>
            <h2>감사 기록</h2>
            <p>로그인, 계정 관리, 원격 진단처럼 보안상 중요한 작업의 이력을 확인합니다.</p>
        </div>

        <button id="auditRefreshButton" class="audit-refresh-button" type="button">
            새로고침
        </button>
    </div>

    <div class="audit-summary-grid" aria-label="감사 기록 요약">
        <article class="audit-summary-card">
            <span>전체 기록</span>
            <strong id="auditTotalCount">0</strong>
            <small>최근 최대 500건</small>
        </article>

        <article class="audit-summary-card">
            <span>로그인 관련</span>
            <strong id="auditLoginCount">0</strong>
            <small>로그인 성공·실패·로그아웃</small>
        </article>

        <article class="audit-summary-card">
            <span>관리자 작업</span>
            <strong id="auditAdminActionCount">0</strong>
            <small>초기화·잠금 해제·원격 진단</small>
        </article>

        <article class="audit-summary-card audit-summary-card-danger">
            <span>실패 기록</span>
            <strong id="auditFailureCount">0</strong>
            <small>실패 또는 거부된 작업</small>
        </article>
    </div>

    <section class="audit-panel">
        <div class="audit-panel-header">
            <div>
                <h3>감사 로그 조회</h3>
                <p id="auditStatusMessage">감사 기록을 불러오는 중입니다.</p>
            </div>
        </div>

        <div class="audit-filter-grid">
            <label class="audit-filter-field audit-search-field">
                <span>검색</span>
                <input
                    id="auditSearchInput"
                    type="search"
                    placeholder="사용자, 대상, IP, 상세 내용 검색">
            </label>

            <label class="audit-filter-field">
                <span>작업 종류</span>
                <select id="auditActionFilter">
                    <option value="ALL">전체 작업</option>
                    <option value="LOGIN">로그인·로그아웃</option>
                    <option value="ACCOUNT">계정·비밀번호</option>
                    <option value="REMOTE">원격 진단</option>
                </select>
            </label>

            <label class="audit-filter-field">
                <span>처리 결과</span>
                <select id="auditResultFilter">
                    <option value="ALL">전체 결과</option>
                    <option value="SUCCESS">성공</option>
                    <option value="FAILURE">실패</option>
                </select>
            </label>

            <label class="audit-filter-field">
                <span>기간</span>
                <select id="auditPeriodFilter">
                    <option value="ALL">전체 기간</option>
                    <option value="TODAY">오늘</option>
                    <option value="7D">최근 7일</option>
                    <option value="30D">최근 30일</option>
                </select>
            </label>
        </div>

        <div class="audit-table-wrapper">
            <table class="audit-table">
                <thead>
                    <tr>
                        <th>시간</th>
                        <th>사용자</th>
                        <th>권한</th>
                        <th>작업</th>
                        <th>대상</th>
                        <th>결과</th>
                        <th class="audit-detail-column">상세</th>
                    </tr>
                </thead>
                <tbody id="auditTableBody">
                    <tr>
                        <td colspan="7" class="audit-empty-cell">
                            감사 기록을 불러오는 중입니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</section>
