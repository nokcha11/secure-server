spring.application.name=secure-server
server.port=8081

# Oracle DB 연결 정보
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=SECURE_AGENT
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 최초 관리자 계정 생성 설정
secureagent.admin.username=${SECURE_ADMIN_USERNAME:admin}
secureagent.admin.initial-password=${SECURE_ADMIN_PASSWORD:}

# 최초 일반 사용자 계정 생성 설정
secureagent.user.username=${SECURE_USER_USERNAME:user}
secureagent.user.initial-password=${SECURE_USER_PASSWORD:}

# STS3 에이전트 전송 API 인증 Key
secureagent.agent.api-key=${SECURE_AGENT_API_KEY:}

# OpenSSH 원격 진단 설정
secure.ssh.private-key-path=${SECURE_SSH_PRIVATE_KEY_PATH:}
secure.ssh.known-hosts-path=${SECURE_SSH_KNOWN_HOSTS_PATH:}
secure.ssh.allowed-hosts=${SECURE_SSH_ALLOWED_HOSTS:}